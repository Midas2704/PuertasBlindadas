name: Validar migraciones aisladas 000-079

on:
  push:
    branches:
      - feature/terreno-agenda-visitas

permissions:
  contents: read

concurrency:
  group: validar-migraciones-aisladas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar-migraciones:
    name: PostgreSQL 18 / Prisma 000-079
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: migraciones_ci
          POSTGRES_PASSWORD: clave_sintetica_migraciones_ci
          POSTGRES_DB: puertas_blindadas_migraciones_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migraciones_ci -d puertas_blindadas_migraciones_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        shell: bash
        working-directory: CODIGO/Controladores

    env:
      DATABASE_URL: postgresql://migraciones_ci:clave_sintetica_migraciones_ci@127.0.0.1:5432/puertas_blindadas_migraciones_ci?schema=public
      PSQL_URL: postgresql://migraciones_ci:clave_sintetica_migraciones_ci@127.0.0.1:5432/puertas_blindadas_migraciones_ci
      DATABASE_URL_COMPAT: postgresql://migraciones_ci:clave_sintetica_migraciones_ci@127.0.0.1:5432/puertas_blindadas_m4_preexistente_ci?schema=public
      PSQL_URL_COMPAT: postgresql://migraciones_ci:clave_sintetica_migraciones_ci@127.0.0.1:5432/puertas_blindadas_m4_preexistente_ci

    steps:
      - name: Descargar código del commit
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CODIGO/Controladores/package-lock.json

      - name: Verificar cadena exacta 000-079
        run: |
          set -Eeuo pipefail
          mapfile -t migraciones < <(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)

          if [[ "${#migraciones[@]}" -ne 80 ]]; then
            printf 'Se esperaban 80 migraciones (000-079), pero se encontraron %s.\n' "${#migraciones[@]}" >&2
            printf '%s\n' "${migraciones[@]}" >&2
            exit 1
          fi

          for numero in $(seq 0 79); do
            prefijo=$(printf '%03d_' "$numero")
            coincidencias=0
            for migracion in "${migraciones[@]}"; do
              [[ "$migracion" == "$prefijo"* ]] && coincidencias=$((coincidencias + 1))
            done
            if [[ "$coincidencias" -ne 1 ]]; then
              printf 'La secuencia %03d debe tener exactamente una migración; encontradas: %s.\n' "$numero" "$coincidencias" >&2
              exit 1
            fi
          done

          printf 'Cadena 000-079 completa, sin saltos ni numeraciones duplicadas.\n'

      - name: Instalar dependencias del backend
        run: npm ci

      - name: Confirmar PostgreSQL temporal 18
        run: |
          set -Eeuo pipefail
          version_servidor=$(psql "$PSQL_URL" -v ON_ERROR_STOP=1 -Atc "SHOW server_version;")
          printf 'PostgreSQL temporal iniciado: %s\n' "$version_servidor"
          [[ "$version_servidor" == 18.* ]]

      - name: Aplicar migraciones 000-075 en la base temporal
        id: migrate_deploy
        run: |
          set -Eeuo pipefail
          mv prisma/migrations/076_schema_comun "$RUNNER_TEMP/076_schema_comun_principal"
          mv prisma/migrations/077_nucleo_operacional_inventario "$RUNNER_TEMP/077_nucleo_operacional_inventario_principal"
          mv prisma/migrations/078_propuesta_permisos_operacionales_inventario "$RUNNER_TEMP/078_propuesta_permisos_operacionales_inventario_principal"
          mv prisma/migrations/079_midas_todos_los_permisos "$RUNNER_TEMP/079_midas_todos_los_permisos_principal"
          npx prisma migrate deploy 2>&1 | tee "$RUNNER_TEMP/prisma-migrate-deploy.log"

      - name: Validar esquema Prisma
        id: prisma_validate
        run: npx prisma validate

      - name: Generar Prisma Client
        id: prisma_generate
        run: npx prisma generate

      - name: Verificar estructura e integridad sintética de 072-074
        id: pruebas_integridad
        run: psql "$PSQL_URL" -v ON_ERROR_STOP=1 --file pruebas/migraciones-072-074.integridad.sql

      - name: Aplicar migración 076 en la base temporal
        id: migrate_076
        run: |
          set -Eeuo pipefail
          mv "$RUNNER_TEMP/076_schema_comun_principal" prisma/migrations/076_schema_comun
          npx prisma migrate deploy 2>&1 | tee "$RUNNER_TEMP/prisma-migrate-076.log"

      - name: Aplicar migraciones 077-078 y probar INT-03 en PostgreSQL aislado
        id: pruebas_integridad_077
        run: |
          set -Eeuo pipefail
          mv "$RUNNER_TEMP/077_nucleo_operacional_inventario_principal" prisma/migrations/077_nucleo_operacional_inventario
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "comun"."permiso" ("codigo_m4","permiso_modulo","permiso_nombre_del_permiso","activo_m4","requiere_administrador")
          VALUES ('CU14','M2','CU14',TRUE,FALSE),('CU15','M2','CU15',TRUE,FALSE)
          ON CONFLICT ("codigo_m4") DO NOTHING;
          SQL
          mv "$RUNNER_TEMP/078_propuesta_permisos_operacionales_inventario_principal" prisma/migrations/078_propuesta_permisos_operacionales_inventario
          npx prisma migrate deploy 2>&1 | tee "$RUNNER_TEMP/prisma-migrate-077.log"
          npx prisma generate
          npm run build
          INVENTARIO_INT03_PG18=1 node --test pruebas/inventario-operacional-int03.test.cjs pruebas/inventario-operacional-pg18.test.cjs

      - name: Aplicar y validar migración 079 sobre instalación 000-078
        id: migrate_079
        run: |
          set -Eeuo pipefail
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 --file pruebas/migracion-079-preparar.sql
          mv "$RUNNER_TEMP/079_midas_todos_los_permisos_principal" prisma/migrations/079_midas_todos_los_permisos
          npx prisma migrate deploy 2>&1 | tee "$RUNNER_TEMP/prisma-migrate-079.log"
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 --file pruebas/migracion-079-verificar.sql
          node --test --test-isolation=none --test-name-pattern="sincronización Midas|regresión: Midas|079 registra" pruebas/c4-2-permisos-midas.test.cjs

      - name: Consultar estado de migraciones 000-079
        id: migrate_status
        run: npx prisma migrate status

      - name: Verificar estructura e integridad del schema común 076
        id: pruebas_integridad_076
        run: |
          set -Eeuo pipefail
          node --test pruebas/migracion-076-schema-comun.test.cjs
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 --file pruebas/migracion-076.integridad.sql

      - name: Confirmar idempotencia de Prisma migrate deploy
        id: migrate_idempotencia
        run: |
          set -Eeuo pipefail
          npx prisma migrate deploy 2>&1 | tee "$RUNNER_TEMP/prisma-migrate-deploy-segunda-ejecucion.log"
          pendientes=$(psql "$PSQL_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM \"_prisma_migrations\" WHERE \"finished_at\" IS NULL AND \"rolled_back_at\" IS NULL;")
          [[ "$pendientes" == "0" ]]

      - name: Validar actualización progresiva 075-079 sobre instalación existente
        id: compatibilidad_075
        run: |
          set -Eeuo pipefail
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE puertas_blindadas_m4_preexistente_ci'

          migracion_075="$RUNNER_TEMP/075_reconciliacion_catalogo_m4"
          migracion_076="$RUNNER_TEMP/076_schema_comun"
          migracion_077="$RUNNER_TEMP/077_nucleo_operacional_inventario"
          migracion_078="$RUNNER_TEMP/078_propuesta_permisos_operacionales_inventario"
          migracion_079="$RUNNER_TEMP/079_midas_todos_los_permisos"
          mv prisma/migrations/075_reconciliacion_catalogo_m4 "$migracion_075"
          mv prisma/migrations/076_schema_comun "$migracion_076"
          mv prisma/migrations/077_nucleo_operacional_inventario "$migracion_077"
          mv prisma/migrations/078_propuesta_permisos_operacionales_inventario "$migracion_078"
          mv prisma/migrations/079_midas_todos_los_permisos "$migracion_079"
          DATABASE_URL="$DATABASE_URL_COMPAT" npx prisma migrate deploy
          psql "$PSQL_URL_COMPAT" -v ON_ERROR_STOP=1 --file pruebas/migracion-075-preexistente.preparar.sql
          mv "$migracion_075" prisma/migrations/075_reconciliacion_catalogo_m4
          DATABASE_URL="$DATABASE_URL_COMPAT" npx prisma migrate deploy
          psql "$PSQL_URL_COMPAT" -v ON_ERROR_STOP=1 --file pruebas/migracion-075-preexistente.verificar.sql
          mv "$migracion_076" prisma/migrations/076_schema_comun
          DATABASE_URL="$DATABASE_URL_COMPAT" npx prisma migrate deploy
          DATABASE_URL="$DATABASE_URL_COMPAT" npx prisma migrate status
          psql "$PSQL_URL_COMPAT" -v ON_ERROR_STOP=1 --file pruebas/migracion-076.integridad.sql
          mv "$migracion_077" prisma/migrations/077_nucleo_operacional_inventario
          DATABASE_URL="$DATABASE_URL_COMPAT" npx prisma migrate deploy
          mv "$migracion_078" prisma/migrations/078_propuesta_permisos_operacionales_inventario
          DATABASE_URL="$DATABASE_URL_COMPAT" npx prisma migrate deploy
          psql "$PSQL_URL_COMPAT" -v ON_ERROR_STOP=1 --file pruebas/migracion-079-preparar.sql
          mv "$migracion_079" prisma/migrations/079_midas_todos_los_permisos
          DATABASE_URL="$DATABASE_URL_COMPAT" npx prisma migrate deploy
          psql "$PSQL_URL_COMPAT" -v ON_ERROR_STOP=1 --file pruebas/migracion-079-verificar.sql
          DATABASE_URL="$DATABASE_URL_COMPAT" npx prisma migrate status

      - name: Resumen verificable
        if: always()
        working-directory: CODIGO/Controladores
        run: |
          set +e
          consultar_estado() {
            local patron="$1"
            psql "$PSQL_URL" -Atc "
              SELECT CASE
                WHEN count(*) = 1 AND bool_and(\"finished_at\" IS NOT NULL AND \"rolled_back_at\" IS NULL) THEN 'APROBADA'
                WHEN count(*) = 0 THEN 'NO APLICADA'
                ELSE 'FALLIDA O INCOMPLETA'
              END
              FROM \"_prisma_migrations\"
              WHERE \"migration_name\" LIKE '${patron}';
            " 2>/dev/null
          }

          estado_base=$(psql "$PSQL_URL" -Atc "
            SELECT CASE
              WHEN count(*) = 72 AND bool_and(\"finished_at\" IS NOT NULL AND \"rolled_back_at\" IS NULL) THEN 'APROBADAS'
              ELSE 'INCOMPLETAS (' || count(*) || '/72 registradas)'
            END
            FROM \"_prisma_migrations\"
            WHERE split_part(\"migration_name\", '_', 1)::integer BETWEEN 0 AND 71;
          " 2>/dev/null)
          [[ -n "$estado_base" ]] || estado_base="NO VALIDADO"

          estado_072=$(consultar_estado '072_%'); [[ -n "$estado_072" ]] || estado_072="NO VALIDADA"
          estado_073=$(consultar_estado '073_%'); [[ -n "$estado_073" ]] || estado_073="NO VALIDADA"
          estado_074=$(consultar_estado '074_%'); [[ -n "$estado_074" ]] || estado_074="NO VALIDADA"
          estado_075=$(consultar_estado '075_%'); [[ -n "$estado_075" ]] || estado_075="NO VALIDADA"
          estado_076=$(consultar_estado '076_%'); [[ -n "$estado_076" ]] || estado_076="NO VALIDADA"
          estado_077=$(consultar_estado '077_%'); [[ -n "$estado_077" ]] || estado_077="NO VALIDADA"
          estado_078=$(consultar_estado '078_%'); [[ -n "$estado_078" ]] || estado_078="NO VALIDADA"
          estado_079=$(consultar_estado '079_%'); [[ -n "$estado_079" ]] || estado_079="NO VALIDADA"
          version_postgres=$(psql "$PSQL_URL" -Atc "SHOW server_version;" 2>/dev/null)
          [[ "$version_postgres" == 18.* ]] && estado_postgres="INICIADO (${version_postgres})" || estado_postgres="NO INICIADO O INCOMPATIBLE"

          {
            echo '## Validación aislada de migraciones'
            echo
            echo '| Verificación | Resultado |'
            echo '|---|---|'
            echo "| PostgreSQL temporal | ${estado_postgres} |"
            echo "| Migraciones 000-071 | ${estado_base} |"
            echo "| Migración 072 | ${estado_072} |"
            echo "| Migración 073 | ${estado_073} |"
            echo "| Migración 074 | ${estado_074} |"
            echo "| Migración 075 | ${estado_075} |"
            echo "| Migración 076 | ${estado_076} |"
            echo "| Migración 077 | ${estado_077} |"
            echo "| Migración 078 | ${estado_078} |"
            echo "| Migración 079 | ${estado_079} |"
            echo "| Aplicación controlada 076 | ${{ steps.migrate_076.outcome }} |"
            echo "| Prisma migrate status | ${{ steps.migrate_status.outcome }} |"
            echo "| Prisma validate | ${{ steps.prisma_validate.outcome }} |"
            echo "| Prisma Client | ${{ steps.prisma_generate.outcome }} |"
            echo "| Pruebas sintéticas | ${{ steps.pruebas_integridad.outcome }} |"
            echo "| Integridad schema común 076 | ${{ steps.pruebas_integridad_076.outcome }} |"
            echo "| Núcleo operacional Inventario 077 | ${{ steps.pruebas_integridad_077.outcome }} |"
            echo "| Propuesta permisos Inventario 078 | ${{ steps.pruebas_integridad_077.outcome }} |"
            echo "| Permisos raíz Midas 079 | ${{ steps.migrate_079.outcome }} |"
            echo "| Segunda ejecución idempotente | ${{ steps.migrate_idempotencia.outcome }} |"
            echo "| Actualización progresiva 075-079 | ${{ steps.compatibilidad_075.outcome }} |"
            echo
            echo 'La base y el servicio PostgreSQL pertenecen exclusivamente a este job y se eliminan al finalizar el runner.'
          } >> "$GITHUB_STEP_SUMMARY"
